openapi: 3.0.3
info:
  title: HB-Api-Cocktail
  version: 1.0.0
  description: |
    API du domaine Hobbies dediee aux cocktails.

    Contenu textuel des recettes en anglais.

    Trois familles d'endpoints :
      - Lecture publique : consultation et recherche des cocktails et referentiels.
      - Preferences (tag `preferences`) : bar et favoris de l'utilisateur, portes
        integralement par des cookies poses et relus par le serveur. Le service
        reste sans etat : il ne stocke rien, il n'y a ni base ni compte utilisateur.
      - Ecriture locale (tag `local`) : ajout d'une recette et upload d'image,
        joignable uniquement en loopback 127.0.0.1 et protege par un token.

    Ce document decrit l'integralite de la surface v1, entierement implementee et
    exposee : lecture et recherche des cocktails, referentiels, service d'images,
    preferences utilisateur, ecriture locale et sonde de disponibilite.
servers:
  - url: http://127.0.0.1:8080
    description: |
      Service local (placeholder). En production l'API ecoute sur
      127.0.0.1:8310 (unite systemd hb-api-cocktail), exposee derriere
      Cloudflare Tunnel sous https://api-cocktail.qvl-project.com.
  - url: https://api-cocktail.qvl-project.com
    description: Production (Cloudflare Tunnel)
tags:
  - name: public
    description: Lecture publique des cocktails et de la recherche.
  - name: referentials
    description: Referentiels de lecture publique (ingredients, categories, tags).
  - name: images
    description: Service d'images des cocktails.
  - name: preferences
    description: |
      Bar et favoris de l'utilisateur, portes integralement par des cookies
      poses et relus par le serveur. Le service ne stocke rien : aucune base,
      aucun compte, aucun identifiant de session.
  - name: local
    description: |
      Ecriture locale non publique. Joignable uniquement en loopback (127.0.0.1)
      et protege par un token via l'en-tete Authorization. Ne pas exposer.
  - name: system
    description: Sonde de disponibilite.
paths:
  /cocktails:
    get:
      tags: [public]
      summary: Lister les cocktails
      description: Liste paginee des cocktails, filtrable par category, strength, alcoholic, season et tag.
      operationId: listCocktails
      security: []
      parameters:
        - $ref: '#/components/parameters/CategoryFilter'
        - $ref: '#/components/parameters/StrengthFilter'
        - $ref: '#/components/parameters/AlcoholicFilter'
        - $ref: '#/components/parameters/SeasonFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Liste paginee des cocktails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CocktailList'
              examples:
                page:
                  summary: Premiere page filtree sur category=Classic
                  value:
                    items:
                      - id: 1
                        name: Margarita
                        instructions: Rub the rim of the glass with lime and dip it in salt. Shake tequila, triple sec and lime juice with ice, then strain into the glass.
                        glass: Margarita glass
                        category: Classic
                        strength: Strong
                        alcoholic: true
                        season: Summer
                        image: margarita.jpg
                        tags: [iba, sour, tequila]
                        ingredients:
                          - { name: Lime juice, quantity: '15', unit: ml }
                          - { name: Salt, quantity: '', unit: rim, garnish: true }
                          - { name: Tequila, quantity: '50', unit: ml }
                          - { name: Triple sec, quantity: '20', unit: ml }
                      - id: 4
                        name: Old Fashioned
                        instructions: Stir sugar, bitters and a splash of water in the glass. Add bourbon and ice, stir, then garnish with an orange peel.
                        glass: Rocks glass
                        category: Classic
                        strength: Strong
                        alcoholic: true
                        season: Winter
                        image: old-fashioned.jpg
                        tags: [iba, strong, whiskey]
                        ingredients:
                          - { name: Angostura bitters, quantity: '2', unit: dashes }
                          - { name: Bourbon, quantity: '60', unit: ml }
                          - { name: Orange peel, quantity: '1', unit: piece, garnish: true }
                          - { name: Sugar, quantity: '1', unit: cube }
                    total: 2
                    limit: 20
                    offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [local]
      summary: Ajouter un cocktail et son image
      description: |
        Cree une recette et televerse son image dans la meme requete multipart.
        Endpoint non public : joignable uniquement en loopback (127.0.0.1) et
        protege par un token via l'en-tete Authorization.
      operationId: createCocktail
      security:
        - localWriteToken: []
      requestBody:
        required: true
        description: |
          Requete `multipart/form-data` a deux parts :
            - `cocktail` (obligatoire) : recette serialisee en JSON, conforme a
              `CocktailInput`. Les champs inconnus sont refuses. Chaque
              ingredient peut porter `garnish`, et un nom d'ingredient repete
              dans la meme recette est refuse en `400`.
            - `image` (optionnelle) : fichier binaire jpeg, png ou webp, valide
              sur le contenu reel du fichier, taille maximale 2 Mo. Le nom du
              fichier stocke est genere par le serveur (`{id}.{ext}`).
          Authentification requise : en-tete `Authorization: Bearer <token>` et
          appel emis depuis 127.0.0.1.
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CocktailCreateForm'
            encoding:
              cocktail:
                contentType: application/json
              image:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Cocktail cree.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cocktail'
              examples:
                created:
                  summary: Cocktail cree avec image (nom genere par le serveur)
                  value:
                    id: 6
                    name: Negroni
                    instructions: Stir gin, Campari and sweet vermouth with ice, then strain over a large ice cube and garnish with an orange peel.
                    glass: Rocks glass
                    category: Classic
                    strength: Strong
                    alcoholic: true
                    season: All year
                    image: 6.jpg
                    tags: [bitter, gin, iba]
                    ingredients:
                      - { name: Campari, quantity: '30', unit: ml }
                      - { name: Gin, quantity: '30', unit: ml }
                      - { name: Orange peel, quantity: '1', unit: piece, garnish: true }
                      - { name: Sweet vermouth, quantity: '30', unit: ml }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cocktails/search:
    get:
      tags: [public]
      summary: Rechercher des cocktails par ingredients
      description: |
        Recherche les cocktails contenant les ingredients fournis.
        Le parametre `match` controle la strategie : `all` exige tous les
        ingredients (defaut), `any` en exige au moins un.
        Le marqueur `garnish` n'influence pas la correspondance : une garniture
        reste un ingredient recherchable.
      operationId: searchCocktails
      security: []
      parameters:
        - name: ingredients
          in: query
          required: true
          description: Noms d'ingredients separes par des virgules.
          schema:
            type: string
          example: lime juice,mint
        - name: match
          in: query
          required: false
          description: Strategie de correspondance.
          schema:
            type: string
            enum: [all, any]
            default: all
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: |
            Liste paginee des cocktails correspondants. Un ingredient inconnu ne
            provoque pas d'erreur : il reduit simplement les correspondances,
            jusqu'a une liste vide (`items: []`, `total: 0`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CocktailList'
              examples:
                matchAll:
                  summary: ingredients=lime juice,mint avec match=all
                  value:
                    items:
                      - id: 2
                        name: Mojito
                        instructions: Muddle mint leaves with sugar and lime juice. Add rum, top with soda water and crushed ice, then stir gently.
                        glass: Highball glass
                        category: Refreshing
                        strength: Medium
                        alcoholic: true
                        season: Summer
                        image: mojito.jpg
                        tags: [mint, refreshing, rum]
                        ingredients:
                          - { name: Lime juice, quantity: '25', unit: ml }
                          - { name: Mint, quantity: '6', unit: leaves }
                          - { name: Soda water, quantity: '', unit: top }
                          - { name: Sugar, quantity: '2', unit: tsp }
                          - { name: White rum, quantity: '50', unit: ml }
                      - id: 3
                        name: Virgin Mojito
                        instructions: Muddle mint leaves with sugar and lime juice. Top with soda water and crushed ice, then stir gently.
                        glass: Highball glass
                        category: Refreshing
                        strength: None
                        alcoholic: false
                        season: Summer
                        image: virgin-mojito.jpg
                        tags: [mint, mocktail, refreshing]
                        ingredients:
                          - { name: Lime juice, quantity: '25', unit: ml }
                          - { name: Mint, quantity: '6', unit: leaves }
                          - { name: Soda water, quantity: '', unit: top }
                          - { name: Sugar, quantity: '2', unit: tsp }
                    total: 2
                    limit: 20
                    offset: 0
                emptyMatch:
                  summary: Ingredient inconnu, aucune correspondance
                  value:
                    items: []
                    total: 0
                    limit: 20
                    offset: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /cocktails/{id}:
    get:
      tags: [public]
      summary: Recuperer un cocktail
      operationId: getCocktail
      security: []
      parameters:
        - $ref: '#/components/parameters/CocktailId'
      responses:
        '200':
          description: Cocktail trouve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cocktail'
              examples:
                margarita:
                  summary: Cocktail id=1
                  value:
                    id: 1
                    name: Margarita
                    instructions: Rub the rim of the glass with lime and dip it in salt. Shake tequila, triple sec and lime juice with ice, then strain into the glass.
                    glass: Margarita glass
                    category: Classic
                    strength: Strong
                    alcoholic: true
                    season: Summer
                    image: margarita.jpg
                    tags: [iba, sour, tequila]
                    ingredients:
                      - { name: Lime juice, quantity: '15', unit: ml }
                      - { name: Salt, quantity: '', unit: rim, garnish: true }
                      - { name: Tequila, quantity: '50', unit: ml }
                      - { name: Triple sec, quantity: '20', unit: ml }
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ingredients:
    get:
      tags: [referentials]
      summary: Lister les ingredients
      operationId: listIngredients
      security: []
      responses:
        '200':
          description: Liste des ingredients, triee par nom.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ingredient'
              examples:
                ingredients:
                  summary: Referentiel d'ingredients
                  value:
                    - { id: 5, name: Angostura bitters }
                    - { id: 4, name: Bourbon }
                    - { id: 2, name: Lime juice }
                    - { id: 1, name: Tequila }
                    - { id: 3, name: Triple sec }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /categories:
    get:
      tags: [referentials]
      summary: Lister les categories
      description: Categories distinctes portees par les cocktails.
      operationId: listCategories
      security: []
      responses:
        '200':
          description: Liste des categories, triee.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: [Classic, Modern, Refreshing]
              examples:
                categories:
                  summary: Categories distinctes du seed
                  value: [Classic, Modern, Refreshing]
        '500':
          $ref: '#/components/responses/InternalServerError'
  /tags:
    get:
      tags: [referentials]
      summary: Lister les tags
      description: Tags distincts portes par les cocktails.
      operationId: listTags
      security: []
      responses:
        '200':
          description: Liste des tags, triee.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: [iba, sour, refreshing, mocktail]
              examples:
                tags:
                  summary: Tags distincts du seed
                  value: [bitter, iba, mint, mocktail, party, refreshing, rum, sour, strong, tequila, vodka, whiskey]
        '500':
          $ref: '#/components/responses/InternalServerError'
  /images/{name}:
    get:
      tags: [images]
      summary: Recuperer l'image d'un cocktail
      description: Sert le fichier image identifie par son nom.
      operationId: getImage
      security: []
      parameters:
        - name: name
          in: path
          required: true
          description: Nom du fichier image.
          schema:
            type: string
          example: margarita.jpg
      responses:
        '200':
          description: Fichier image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /preferences:
    get:
      tags: [preferences]
      summary: Lire le bar et les favoris de l'utilisateur
      description: |
        Relit les cookies `hb_bar` et `hb_fav` et renvoie l'etat complet.

        Le service ne stocke rien : les donnees vivent integralement dans les
        cookies. Un cookie absent, illisible ou corrompu donne une liste vide,
        jamais une erreur.

        Chaque cookie effectivement lisible est repose avec un `Max-Age` neuf :
        la duree de vie est une fenetre glissante depuis la derniere visite, et
        non depuis la derniere modification. Aucun cookie n'est pose pour un
        visiteur qui n'en a pas, ni pour un cookie dont le marqueur de schema
        est inconnu : la lecture n'a pas d'effet de bord.
      operationId: getPreferences
      security: []
      parameters:
        - $ref: '#/components/parameters/BarCookie'
        - $ref: '#/components/parameters/FavoritesCookie'
      responses:
        '200':
          description: |
            Etat courant. Les deux tableaux sont toujours presents et jamais
            `null`. En-tete `Cache-Control: no-store` : reponse propre a un
            utilisateur, jamais mutualisable.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/PreferencesSetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              examples:
                stored:
                  summary: Cookies presents et lisibles
                  value:
                    bar: [12, 45]
                    favorites: [3, 7]
                empty:
                  summary: Aucun cookie, ou cookies corrompus
                  value:
                    bar: []
                    favorites: []
    put:
      tags: [preferences]
      summary: Remplacer le bar et les favoris de l'utilisateur
      description: |
        Remplace l'etat complet. L'operation est idempotente et rejouable :
        le meme corps produit le meme etat et les memes cookies.

        Les deux champs sont obligatoires : un champ optionnel rendrait ambigu
        "absent = inchange ou = vide". Vider une liste se fait avec un tableau
        vide, ce qui supprime le cookie correspondant : il n'existe ni `PATCH`,
        ni `DELETE`, ni endpoint par element.

        Les champs inconnus sont refuses, et les noms de champs sont sensibles
        a la casse : `Bar`, `BAR` ou `Favorites` sont refuses au meme titre que
        n'importe quel champ inconnu.

        Les identifiants ne sont pas croises avec le referentiel : aucune
        verification d'existence n'est faite ici. Le client possede deja le
        catalogue et realise ce croisement a cout nul.
      operationId: replacePreferences
      security: []
      requestBody:
        required: true
        description: Etat complet a persister dans les cookies.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesInput'
            examples:
              replace:
                summary: Bar et favoris
                value:
                  bar: [12, 45]
                  favorites: [3, 7]
              clear:
                summary: Tout vider (supprime les deux cookies)
                value:
                  bar: []
                  favorites: []
      responses:
        '200':
          description: |
            Etat normalise : doublons retires, ordre de soumission conserve.
            Les cookies correspondants sont poses dans la meme reponse.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/PreferencesSetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
              examples:
                normalized:
                  summary: Doublons retires
                  value:
                    bar: [12, 45]
                    favorites: [3, 7]
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
  /health:
    get:
      tags: [system]
      summary: Sonde de disponibilite
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  securitySchemes:
    localWriteToken:
      type: http
      scheme: bearer
      description: |
        Token d'ecriture locale transmis dans l'en-tete Authorization.
        Reserve aux appels loopback 127.0.0.1.
  parameters:
    CocktailId:
      name: id
      in: path
      required: true
      description: Identifiant du cocktail.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1
    CategoryFilter:
      name: category
      in: query
      required: false
      description: Filtre sur la categorie.
      schema:
        type: string
      example: Classic
    StrengthFilter:
      name: strength
      in: query
      required: false
      description: Filtre sur la force.
      schema:
        type: string
      example: Strong
    AlcoholicFilter:
      name: alcoholic
      in: query
      required: false
      description: Filtre alcoolise. `false` cible les mocktails.
      schema:
        type: boolean
      example: false
    SeasonFilter:
      name: season
      in: query
      required: false
      description: Filtre sur la saison.
      schema:
        type: string
      example: Summer
    TagFilter:
      name: tag
      in: query
      required: false
      description: Filtre sur un tag.
      schema:
        type: string
      example: refreshing
    Limit:
      name: limit
      in: query
      required: false
      description: Nombre maximum d'elements retournes.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      required: false
      description: Nombre d'elements ignores en tete de liste.
      schema:
        type: integer
        minimum: 0
        default: 0
    BarCookie:
      name: hb_bar
      in: cookie
      required: false
      description: |
        Ingredients du bar, au format `v1.<id>.<id>`. Absent quand la liste est
        vide. Envoye automatiquement par le navigateur ; le cookie est
        `HttpOnly` et n'est donc pas lisible en JavaScript.
      schema:
        type: string
      example: v1.12.45
    FavoritesCookie:
      name: hb_fav
      in: cookie
      required: false
      description: |
        Cocktails favoris, au format `v1.<id>.<id>`. Absent quand la liste est
        vide. Envoye automatiquement par le navigateur ; le cookie est
        `HttpOnly` et n'est donc pas lisible en JavaScript.
      schema:
        type: string
      example: v1.3.7
  headers:
    PreferencesSetCookie:
      description: |
        Un en-tete par liste non vide (`hb_bar`, `hb_fav`), deux en-tetes
        distincts : budgets independants et corruption isolee.

        Attributs poses : `Max-Age=31536000`, `Path=/`, `HttpOnly`,
        `SameSite=Lax`, pas d'attribut `Domain` (cookie host-only). `Secure`
        est derive du protocole de la requete (TLS ou `X-Forwarded-Proto`) et
        jamais d'une variable de build : un cookie `Secure` pose en http est
        rejete silencieusement par le navigateur.

        Une liste vide n'ecrit pas `v1.` seul : le cookie est supprime
        (`Max-Age=0`).
      schema:
        type: string
      example: hb_bar=v1.12.45; Path=/; Max-Age=31536000; HttpOnly; SameSite=Lax
    NoStore:
      description: Reponse propre a un utilisateur, jamais mutualisable.
      schema:
        type: string
        enum: [no-store]
      example: no-store
  schemas:
    Cocktail:
      type: object
      required: [id, name, instructions, glass, category, strength, alcoholic, season, tags, ingredients]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Margarita
        instructions:
          type: string
          example: Shake tequila, triple sec and lime juice with ice, then strain into the glass.
        glass:
          type: string
          example: Margarita glass
        category:
          type: string
          example: Classic
        strength:
          type: string
          example: Strong
        alcoholic:
          type: boolean
          example: true
        season:
          type: string
          example: Summer
        image:
          type: string
          description: Nom de l'image, utilisable avec GET /images/{name}. Vide si absente.
          example: margarita.jpg
        tags:
          type: array
          items:
            type: string
          example: [tequila, sour, iba]
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CocktailIngredient'
    CocktailIngredient:
      type: object
      required: [name, quantity, unit]
      properties:
        name:
          type: string
          example: Tequila
        quantity:
          type: string
          example: '50'
        unit:
          type: string
          example: ml
        garnish:
          type: boolean
          description: |
            Present et vrai uniquement quand l'ingredient est une garniture ou
            un element trivial de cette recette, absent sinon. Le role appartient
            a la liaison cocktail-ingredient : un meme ingredient peut etre
            garniture dans une recette et composant dans une autre. Un client qui
            calcule les cocktails realisables avec son bar ignore les ingredients
            portant ce marqueur.
          enum: [true]
          example: true
    CocktailList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cocktail'
        total:
          type: integer
          description: Nombre total d'elements correspondant au filtre.
          example: 42
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    Ingredient:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Tequila
    CocktailCreateForm:
      type: object
      required: [cocktail]
      properties:
        cocktail:
          allOf:
            - $ref: '#/components/schemas/CocktailInput'
          description: Recette serialisee en JSON dans la part `cocktail`.
          example:
            name: Negroni
            instructions: Stir gin, Campari and sweet vermouth with ice, then strain over a large ice cube and garnish with an orange peel.
            glass: Rocks glass
            category: Classic
            strength: Strong
            alcoholic: true
            season: All year
            tags: [gin, bitter, iba]
            ingredients:
              - { name: Gin, quantity: '30', unit: ml }
              - { name: Campari, quantity: '30', unit: ml }
              - { name: Sweet vermouth, quantity: '30', unit: ml }
              - { name: Orange peel, quantity: '1', unit: piece, garnish: true }
        image:
          type: string
          format: binary
          description: |
            Fichier image de la recette. Types acceptes : jpeg, png, webp,
            valides sur le contenu reel du fichier. Taille maximale : 2 Mo.
            Le nom du fichier stocke est genere par le serveur, le client ne le fournit pas.
    CocktailInput:
      type: object
      required: [name, instructions, glass, category, strength, alcoholic]
      properties:
        name:
          type: string
          example: Margarita
        instructions:
          type: string
          example: Shake tequila, triple sec and lime juice with ice, then strain into the glass.
        glass:
          type: string
          example: Margarita glass
        category:
          type: string
          example: Classic
        strength:
          type: string
          example: Strong
        alcoholic:
          type: boolean
          example: true
        season:
          type: string
          example: Summer
        tags:
          type: array
          items:
            type: string
          example: [tequila, sour, iba]
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/CocktailIngredientInput'
    CocktailIngredientInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Tequila
        quantity:
          type: string
          example: '50'
        unit:
          type: string
          example: ml
        garnish:
          type: boolean
          default: false
          description: |
            Marque l'ingredient comme garniture ou element trivial de cette
            recette. Absent ou `false`, l'ingredient est un composant. Le role
            appartient a la liaison : le meme ingredient peut etre garniture
            dans une recette et composant dans une autre. Un nom d'ingredient
            declare deux fois dans la meme recette est refuse en `400`, jamais
            perdu silencieusement.
          example: true
    Preferences:
      type: object
      required: [bar, favorites]
      description: |
        Etat complet des preferences. Les deux tableaux sont toujours presents,
        jamais `null`, sans doublon et plafonnes a 300 elements.
      properties:
        bar:
          $ref: '#/components/schemas/PreferenceIdList'
        favorites:
          $ref: '#/components/schemas/PreferenceIdList'
    PreferencesInput:
      type: object
      required: [bar, favorites]
      additionalProperties: false
      description: |
        Etat complet a persister. Les deux champs sont obligatoires et les
        champs inconnus sont refuses. Les noms de champs sont sensibles a la
        casse : seuls `bar` et `favorites` sont reconnus.
      properties:
        bar:
          $ref: '#/components/schemas/PreferenceIdList'
        favorites:
          $ref: '#/components/schemas/PreferenceIdList'
    PreferenceIdList:
      type: array
      maxItems: 300
      description: |
        Identifiants entiers, sans croisement avec le referentiel. Un
        depassement de 300 elements est refuse par un `400`, jamais tronque
        silencieusement.
      items:
        type: integer
        format: int64
        minimum: 1
        maximum: 999999999
      example: [12, 45]
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: |
            Code d'erreur stable, lisible par machine. Valeurs possibles :
              - `bad_request` (400) : parametre de requete ou corps invalide.
              - `unauthorized` (401) : token d'ecriture locale manquant ou invalide.
              - `forbidden` (403) : appel refuse car l'origine n'est pas loopback.
              - `not_found` (404) : ressource introuvable (cocktail ou image).
              - `payload_too_large` (413) : charge utile trop volumineuse.
              - `internal_error` (500) : erreur interne du serveur.
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - payload_too_large
            - internal_error
          example: not_found
        message:
          type: string
          description: Description lisible par un humain.
          example: cocktail not found
  responses:
    BadRequest:
      description: |
        Requete invalide. Le champ `message` precise la cause exacte
        (parametre de pagination ou de filtre invalide, corps multipart mal
        forme, part `cocktail` manquante, echec de validation du cocktail,
        type d'image non supporte, etc.).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            invalidLimit:
              summary: Parametre limit hors bornes (1..100)
              value:
                error: bad_request
                message: invalid limit parameter
            invalidCocktailId:
              summary: Identifiant de cocktail non entier ou inferieur a 1
              value:
                error: bad_request
                message: invalid cocktail id
            invalidIngredients:
              summary: Parametre ingredients vide ou trop long (max 20 noms)
              value:
                error: bad_request
                message: invalid ingredients parameter
            missingCocktailPart:
              summary: Part multipart cocktail absente ou vide (POST)
              value:
                error: bad_request
                message: missing cocktail part
            validationFailed:
              summary: Echec de validation du cocktail (POST)
              value:
                error: bad_request
                message: name is required
            duplicateIngredient:
              summary: Nom d'ingredient declare deux fois dans la recette (POST)
              value:
                error: bad_request
                message: ingredient name is duplicated
            unsupportedImage:
              summary: Contenu d'image non jpeg/png/webp (POST)
              value:
                error: bad_request
                message: unsupported image type
            missingPreferencesField:
              summary: Champ obligatoire absent ou null (PUT /preferences)
              value:
                error: bad_request
                message: favorites is required
            invalidPreferencesPayload:
              summary: |
                Corps JSON invalide, champ inconnu, ou variante de casse d'un
                champ connu (PUT /preferences)
              value:
                error: bad_request
                message: invalid preferences payload
            preferencesListTooLong:
              summary: Plus de 300 elements dans une liste (PUT /preferences)
              value:
                error: bad_request
                message: bar must not exceed 300 entries
            preferencesIdOutOfRange:
              summary: Identifiant hors bornes (PUT /preferences)
              value:
                error: bad_request
                message: bar must contain integers between 1 and 999999999
    Unauthorized:
      description: Token d'ecriture locale manquant ou invalide.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unauthorized:
              summary: Bearer absent ou ne correspondant pas a LOCAL_WRITE_TOKEN
              value:
                error: unauthorized
                message: unauthorized
    Forbidden:
      description: Appel refuse car l'origine n'est pas loopback (127.0.0.1).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              summary: Requete emise depuis une adresse non loopback
              value:
                error: forbidden
                message: forbidden
    PayloadTooLarge:
      description: |
        Charge utile trop volumineuse. L'image depasse 2 Mo, le corps multipart
        global depasse la limite acceptee, ou le corps JSON de
        `PUT /preferences` depasse 16 Kio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            payloadTooLarge:
              summary: Image ou corps multipart au-dela de la limite
              value:
                error: payload_too_large
                message: request payload too large
    NotFound:
      description: Ressource introuvable (cocktail ou image).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            cocktailNotFound:
              summary: Aucun cocktail pour cet identifiant
              value:
                error: not_found
                message: cocktail not found
            imageNotFound:
              summary: Nom d'image invalide ou fichier absent
              value:
                error: not_found
                message: image not found
    InternalServerError:
      description: Erreur interne du serveur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            internalError:
              summary: Erreur inattendue cote serveur
              value:
                error: internal_error
                message: internal server error
